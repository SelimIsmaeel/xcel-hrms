<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XCELTECH — Login</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/employee.css">
</head>

<body>
  <div class="auth-shell">
    <div class="auth-form-side">
      <div class="auth-form-inner">
        <h1>Login</h1>
        <div class="sub">Login to your account.</div>

        <div class="form-msg ok" id="registeredMsg">Account created — sign in below to get started.</div>
        <div class="form-msg error" id="loginMsg"></div>

        <form id="loginForm">
          <div class="field">
            <label for="email">E-mail Address</label>
            <input type="email" id="email" required autocomplete="username">
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" required autocomplete="current-password">
          </div>

          <div class="auth-remember-row">
            <label class="inline"><input type="checkbox" id="rememberMe"> Remember me</label>
            <a href="#" id="resetPasswordLink">Reset Password?</a>
          </div>

          <button type="submit" class="auth-submit">Sign In</button>
        </form>

        <div class="auth-footline">Don't have an account yet? <a href="register.html">Join XCELTECH today.</a></div>
      </div>
    </div>

    <div class="auth-graphic">
      <div class="mark"><span class="logo-mark"> <img src="media/xceltech-high-resolution-logo-transparent 1 (1).png"
            alt=""></div>
      <div class="pitch">
        <h2>Manage all <span class="accent">HR Operations</span> from the comfort of your home.</h2>
      </div>
      <div class="foot-dots"><span class="on"></span><span></span><span></span></div>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script>
    const msg = document.getElementById('loginMsg');
    const registeredMsg = document.getElementById('registeredMsg');

    if (sessionStorage.getItem('xt_just_registered')) {
      registeredMsg.classList.add('show');
      sessionStorage.removeItem('xt_just_registered');
    }

    (function () {
      const existing = DataManager.getSession();
      if (existing) {
        window.location.href = (existing.role === 'admin' || existing.role === 'subadmin') ? 'admin.html' : 'employee.html';
      }
    })();

    document.getElementById('resetPasswordLink').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Password reset isn\'t wired up in this demo — try the demo credentials below instead.');
    });

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const user = DataManager.findByEmail(email);

      if (!user || user.password !== password) {
        msg.textContent = 'Email or password is incorrect.';
        msg.classList.add('show');
        return;
      }
      if (user.status === 'inactive') {
        msg.textContent = 'This account is inactive. Contact HR for access.';
        msg.classList.add('show');
        return;
      }

      DataManager.setSession(user.id);
      window.location.href = (user.role === 'admin' || user.role === 'subadmin') ? 'admin.html' : 'employee.html';
    });
  </script>
</body>

</html>
